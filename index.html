<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manzanas Enfrentadas</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f2f2f7;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      max-width: 340px;
      width: 100%;
    }
    h2 {
      margin-top: 0;
      font-size: 20px;
      color: #1c1c1e;
    }
    p {
      font-size: 14px;
      color: #636366;
      line-height: 1.4;
      margin-bottom: 20px;
    }
    .btn-open {
      display: block;
      width: 100%;
      padding: 14px 0;
      background: #007aff;
      color: white;
      text-decoration: none;
      border-radius: 14px;
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 12px;
      box-sizing: border-box;
    }
    .btn-store {
      display: block;
      width: 100%;
      padding: 12px 0;
      background: #f2f2f7;
      color: #1c1c1e;
      text-decoration: none;
      border-radius: 14px;
      font-weight: 500;
      font-size: 14px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Abriendo en la App...</h2>
    <p>Toca el botón si no se abre automáticamente.</p>
    <a id="btnOpen" class="btn-open" href="#">Abrir en Manzanas Enfrentadas</a>
    <a id="btnStore" class="btn-store" href="https://apps.apple.com/es/app/manzanas-enfrentadas-the-app/id6747011620">Descargar en App Store</a>
  </div>

  <script>
    const searchString = window.location.search || window.location.hash.replace('#', '?');
    const params = new URLSearchParams(searchString);
    const appStoreURL = "https://apps.apple.com/es/app/manzanas-enfrentadas-the-app/id6747011620";
    
    let deepLink = "meiosapp://noticias";

    const isStudio = params.has("studio_session") || params.has("session_id") || params.get("action") === "staff_attendance";
    const commentID = params.get("comment_id") || params.get("commentid");
    const openComments = params.get("comments") === "true" || !!commentID;

    if (isStudio) {
      const sid = params.get("studio_session") || params.get("session_id") || params.get("id") || "";
      const action = params.get("action") || "staff_attendance";
      deepLink = "meiosapp://studio?session_id=" + encodeURIComponent(sid) + "&action=" + encodeURIComponent(action);
    } else if (params.has("podcast")) {
      const id = params.get("podcast") || params.get("id") || "";
      let url = "meiosapp://podcast?id=" + encodeURIComponent(id);
      if (openComments) url += "&comments=true";
      if (commentID) url += "&comment_id=" + encodeURIComponent(commentID);
      deepLink = url;
    } else if (params.has("noticia") || params.has("id")) {
      const id = params.get("noticia") || params.get("id") || "";
      let url = "meiosapp://noticias?id=" + encodeURIComponent(id);
      if (openComments) url += "&comments=true";
      if (commentID) url += "&comment_id=" + encodeURIComponent(commentID);
      deepLink = url;
    }

    const btnOpen = document.getElementById("btnOpen");
    btnOpen.href = deepLink;

    // Intento de apertura automática inmediata en la app
    window.location.replace(deepLink);

    // Si pasados 2.5s sigue en el navegador, preparar enlace a App Store
    setTimeout(function() {
      if (!document.hidden) {
        window.location.href = appStoreURL;
      }
    }, 2500);
  </script>
</body>
</html>
