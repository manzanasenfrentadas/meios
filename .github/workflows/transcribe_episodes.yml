name: Transcripción Automática de Podcasts con Whisper

on:
  schedule:
    # Lunes a Sábado a las 06:05h (05:05 UTC) justo cuando sale el podcast
    - cron: '5 5 * * 1-6'
    # Lunes a Sábado a las 06:30h (05:30 UTC) por si se retrasa la publicación
    - cron: '30 5 * * 1-6'
    # Domingos a las 19:05h (18:05 UTC) justo cuando sale el podcast
    - cron: '5 18 * * 0'
    # Domingos a las 19:30h (18:30 UTC) de seguridad
    - cron: '30 18 * * 0'
    # Pasadas adicionales para avanzar episodios antiguos hacia atrás
    - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ⚙️ Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install --upgrade pip
          pip install faster-whisper

      - name: 🎙️ Ejecutar transcripción de episodios pendientes
        run: |
          python transcribe_episodes.py

      - name: 🚀 Publicar transcripciones en GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p transcripts
          git add transcripts/
          if git diff --staged --quiet; then
            echo "No hay nuevas transcripciones para subir."
          else
            git commit -m "🎙️ Nuevas transcripciones automáticas generadas con Whisper [skip ci]"
            git push
          fi
